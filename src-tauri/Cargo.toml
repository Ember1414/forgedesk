[package]
name = "forgedesk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ForgeDesk — A Git client for everyone"
default-run = "forgedesk"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
forgedesk-domain.workspace = true
forgedesk-diagnostics.workspace = true
forgedesk-commands.workspace = true
forgedesk-platform.workspace = true
forgedesk-storage.workspace = true

[lints]
workspace = true

[features]
# 由 `tauri build` 在正式打包时启用，用于区分 dev / release 行为
custom-protocol = ["tauri/custom-protocol"]
