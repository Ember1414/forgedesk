[package]
name = "forgedesk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ForgeDesk — A Git client for everyone"
default-run = "forgedesk"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
forgedesk-domain.workspace = true
forgedesk-diagnostics.workspace = true
# 凭据（T2.7）：宿主需要它在 Tauri 初始化之前处理 `--askpass` 调用
# （git 会把本进程当作凭据提示的应答者拉起）
forgedesk-credentials.workspace = true
forgedesk-commands.workspace = true
forgedesk-jobs.workspace = true
forgedesk-platform.workspace = true
forgedesk-provider.workspace = true
forgedesk-services.workspace = true
# 宿主在这里选择注入哪个快照实现：M3/T1.9 之前是 `NoopSnapshotManager`
# （如实回答"没有快照"），T1.9 换成真实实现时只改这一行。
forgedesk-snapshot.workspace = true
forgedesk-storage.workspace = true
tauri-plugin-dialog = "2.7.3"

[lints]
workspace = true

[features]
# 由 `tauri build` 在正式打包时启用，用于区分 dev / release 行为
custom-protocol = ["tauri/custom-protocol"]
