# ============================================================
# pnpm 配置入口
#
# 说明：pnpm 10+ 已不再读取 package.json 的 "pnpm" 字段，配置统一放在本文件。
# 本项目是单包项目（不是 monorepo），因此这里**只放设置，不放 packages**。
#
# onlyBuiltDependencies：pnpm 10+ 默认不执行依赖的构建脚本，遇到需要构建的包时会弹出
# 交互式选择框（Press <space> to select...），在脚本化场景下会直接卡住命令。
# 这里显式批准两个常见的需要构建的包，其余依赖保持默认不执行，避免扩大攻击面。
#
# 注意（实测结论）：本配置**只对 `pnpm install` 生效**。
# `pnpm dlx` 在隔离目录中安装，不读取本文件，因此仍会弹提示；
# 需要以非交互方式运行 wrangler 之类的工具时，请使用 `npx --yes <pkg>`
# （npm 没有构建审批机制），这也是 package.json 中 pages:* 脚本的做法。
# ============================================================

onlyBuiltDependencies:
  - esbuild
  - workerd

# 供应链加固（T0.12 / OPS-6）：强制把存在已知漏洞的传递依赖钉到修复版。
# ansi-regex@5.0.0 ReDoS（GHSA-93q8-gq69-wqmw，经 pretty-format@27 传入，仅 dev 链路）。
# 升级 jest-dom / pretty-format 主版本后可移除本条。
overrides:
  ansi-regex@<5.0.1: 5.0.1
