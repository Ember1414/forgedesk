name: CI

# ===========================================================================
# 两阶段 CI 策略
# 决策记录：docs/adr/ADR-002-private-first-two-phase-ci.md
#
# 【私有阶段（当前）】目标是把免费配额花在最值钱的地方。
#   GitHub Free 的私有仓库额度为 2000 分钟/月，且 macOS runner 按 10x、
#   Windows runner 按 2x 计费（实测一次三平台矩阵约 130 配额分钟）。因此：
#     · pull_request      → 只跑 Linux 质量门禁（1x），约 6-8 分钟
#     · push to main      → 同样只跑质量门禁（**不跑矩阵**）
#     · tag v*.*.*        → 质量门禁 + 三平台构建
#     · workflow_dispatch → 手动；勾选 run_build 才跑矩阵
#     · 不启用夜间任务
#
# 【公开阶段（转公开后）】公共仓库的 Actions 额度不受限制。
#   需要执行的改动（清单见 docs/OPEN-SOURCE-READINESS.md）：
#     1. 删除 build job 上的 `if:`，恢复"每个 PR 都跑三平台矩阵"
#     2. 启用 e2e 与 nightly 工作流
#     3. 把所有 `uses:` 固定到 commit SHA
#
# 【Action 版本约束】GitHub 已于 2026-09-23 移除 Node 20（见
#   https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/ ）。
#   工作流中所有 JavaScript 类 action 必须使用运行在 Node 24 上的版本：
#     actions/checkout@v7、actions/setup-node@v7、actions/upload-artifact@v7、
#     pnpm/action-setup@v6（Swatinem/rust-cache@v2 当前已是最新；
#     dtolnay/rust-toolchain 是复合 action，不涉及 Node 运行时）。
#   升级 action 主版本时请一并核对输入参数是否有破坏性变更。
# ===========================================================================

on:
  pull_request:
  push:
    branches: [main]
    # 打 tag 时必然需要三平台产物（见 build job 的 if 条件）
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      run_build:
        description: '运行三平台构建矩阵？私有仓库下约消耗 130 配额分钟，谨慎勾选'
        type: boolean
        default: false

# 同一分支的旧运行会被取消，避免浪费配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：CI 只需要读仓库内容
permissions:
  contents: read

env:
  # 曾是 always（为了日志好看），但色码会让失败注解的 `grep '^error'` 匹配不到
  # 任何行——2026-10-07 的真实教训：错误行全被 `\x1b[91merror` 吃掉，只剩
  # "could not compile"的尾行。RUST_BACKTRACE 保留：panic 注解里带回栈
  # 比只有一行 assert 有用得多。
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: quality

      # src-tauri 依赖 WebKitGTK / GTK / libsecret，clippy 覆盖整个 workspace 时需要；
      # libdbus-1-dev 是 crates/credentials 的 keyring（Linux 走 Secret Service）在**编译期**
      # 需要的（libdbus-sys 通过 pkg-config 找它）。运行时还需要一个 Secret Service 提供者
      # （gnome-keyring / KWallet），没有时应用返回 KEYRING_UNAVAILABLE 并走加密文件回退。
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsecret-1-dev \
            libdbus-1-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm lint

      # 硬编码文案不会让任何测试变红，但会在做中英完整覆盖时集中爆雷，
      # 因此从 M0 起就作为门禁（AGENTS.md §6「文案全 i18n」）
      - name: i18n hard-coded copy check
        run: pnpm i18n:lint

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend unit tests
        run: pnpm test

      - name: Design token contrast (WCAG AA)
        run: pnpm check:contrast

      - name: Workflow YAML validation
        run: pnpm check:workflows

      # 本地有、仓库里没有的目录（例如被 .gitignore 误伤的源码目录）会让 cargo
      # 在 CI 上以"failed to load manifest for workspace member"失败，报错位置还指不到根因。
      # 这条检查把它变成推送前就能发现的错误。
      - name: Repository consistency (workspace members tracked)
        run: pnpm check:repo

      # 文档里的相对链接与锚点必须有效：文档是新人唯一的入口，
      # 断链比没有文档更糟——它会让人以为"东西不存在"。
      - name: Documentation links
        run: pnpm check:docs

      # 官网是仓库里唯一没有其他测试覆盖的面向用户的代码：它按命名约定拼下载地址，
      # 拼错的后果是"官网上的下载按钮 404"。这条检查用真实生成的清单夹具跑一遍页面脚本。
      - name: Landing page self-check
        run: pnpm check:site

      # 版本号三处（tauri.conf.json / package.json / Cargo.toml）必须一致：
      # 漏改一处的后果是产物名与关于页/ crate 版本不一致，而它要到打包后才暴露。
      - name: Version consistency
        run: pnpm version:check

      - name: Rust format
        run: cargo fmt --all -- --check

      # 以下 cargo 构建/测试步骤一律带 `--locked`：CI 必须用**提交进仓库的** Cargo.lock，
      # 若锁文件过期就立刻失败，而不是在 runner 上悄悄解析出另一组版本
      # （本地不加此参数，因为开发时需要能更新锁文件）。见 OPEN-SOURCE-READINESS C-2。
      - name: Rust clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee clippy.log

      # 失败详情只进日志（日志 API 不允许匿名读取），把首因提升为注解——注解可以匿名读取。
      # 背景：clippy 在 Linux 上才编译 `cfg(unix)` 路径，"本地 Windows 全绿、CI 红"的
      # 平台差异问题由此可直接定位（2026-10-07 的真实案例）。
      - name: Clippy failure annotation
        if: failure()
        run: |
          grep -E '^error|panicked at' clippy.log | head -8 | while IFS= read -r line; do
            echo "::error title=clippy (Linux)::${line:0:200}"
          done
          # 兜底：无论错误形态是什么，把日志尾部亮出来（注解匿名可读）
          tail -3 clippy.log | while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::error title=clippy tail::${line:0:200}"
          done

      # 测试夹具应该自足（仓库级身份由各自配置）；这条全局身份是**防御层**——
      # 任何漏配身份的新测试不会因此挂掉 CI（2026-09-28 起的长期红灯根因：
      # differential 生命周期用例依赖 runner 全局身份，runner 上没有）。
      - name: Configure git identity for tests
        run: |
          git config --global user.name "ForgeDesk CI"
          git config --global user.email "ci@forgedesk.invalid"

      - name: Rust tests
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test.log

      # 同上：panic 消息与失败用例名提升为注解，匿名可读，省一次"猜是哪条用例"
      - name: Test failure annotation
        if: failure()
        run: |
          grep -E 'panicked at' test.log | head -5 | while IFS= read -r line; do
            echo "::error title=test panic::${line:0:180}"
          done
          sed -n '/^failures:$/,$p' test.log | grep -vE '^(failures:|test result:)' | head -10 | while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::error title=failed test::$line"
          done

  # ------------------------------------------------------------------
  # T3.11 破坏性操作安全测试矩阵（docs/PLAN.md §10.6 的 15 个场景）：
  # 独立 job、必过门禁——任何一条失败即阻断发布（AGENT-PROMPTS §4.4 T3.11）。
  # 之所以单独成 job 而不是藏在 quality 的 cargo test 里：
  # "安全网红了"必须一眼可见、必须能被单独重跑，它不能淹没在几千条测试里。
  # ------------------------------------------------------------------
  safety:
    name: safety (destructive matrix)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: quality

      # 用例自足（各自 init_repo 并配置身份）；这条全局身份是防御层，与 quality 同因
      - name: Configure git identity for tests
        run: |
          git config --global user.name "ForgeDesk CI"
          git config --global user.email "ci@forgedesk.invalid"

      # keyring（crates/credentials）在 Linux 上的 sync-secret-service 走 libdbus-sys，
      # 编译期需要 dbus-1 头文件——quality 有整包安装，这个精简作业只装真正需要的
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev

      - name: Destructive operation safety matrix
        run: |
          set -o pipefail
          cargo test -p forgedesk-services --test destructive_safety_matrix --locked 2>&1 | tee matrix.log

      # 同上：panic 消息与失败用例名提升为注解，匿名可读
      - name: Matrix failure annotation
        if: failure()
        run: |
          grep -E 'panicked at' matrix.log | head -5 | while IFS= read -r line; do
            echo "::error title=matrix panic::${line:0:180}"
          done
          sed -n '/^failures:$/,$p' matrix.log | grep -vE '^(failures:|test result:)' | head -10 | while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::error title=failed matrix case::$line"
          done

  example-plugins:
    name: example-plugins (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-wasip1
      - name: 构建示例插件并同步产物
        run: node scripts/build-plugins.mjs
      # 产物由 Windows 端 rustc/lld 生成并入库；跨 OS 的编译器在 DWARF（编译目录等）
      # 上并不逐字节一致，因此"源码 ↔ 产物"的同步校验只在产物来源平台上执行——
      # 在 Linux 上做字节比较等于要求两个编译器逐字节相同，那不是本检查的目的。
      # 构建本身仍然两平台都跑：它验证插件 SDK 在两个平台都能编译。
      - name: 校验产物与源码同步（忘了跑构建脚本会在这里红）
        if: runner.os == 'Windows'
        run: git diff --exit-code -- plugins/examples
      - name: 冒烟测试（加载入库产物）
        run: cargo test -p forgedesk-plugin-host --test example_plugins --locked

  build:
    name: build (${{ matrix.platform }})
    needs: [quality, safety]
    # 三平台矩阵**每个 PR / 每次 push main 都跑**。
    #
    # 历史：私有阶段这里曾有一条 `if`，把矩阵收窄到"只打 tag 或手动勾选"——
    # 因为私有仓库按倍率计费（Windows 2x / macOS 10x），一次矩阵约 130 配额分钟，
    # 而免费私有仓库每月只有 2000 分钟（见 ADR-002）。2026-10-07 仓库转公开后，
    # 公共仓库的 standard runner 不计费，这条限制的前提消失，故删除（ADR-002 已补记）。
    # 单行写法：块标量会让表达式带上换行，虽然 GitHub 能处理，但这里刻意保持单行以便本地校验
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
          - macos-14
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: build-${{ matrix.platform }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsecret-1-dev \
            libdbus-1-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------------
      # 构建分两条路径（T0.11）：
      #   tag 构建   → release + 全量打包（安装包、归一化命名、SHA256SUMS、冒烟）
      #   其余构建   → debug + no-bundle（只验证"能出可执行文件"，不下载 WiX/NSIS）
      # ------------------------------------------------------------------
      - name: Build application (release, with bundles)
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm tauri build

      - name: Build application (debug, no bundle)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: pnpm tauri build --debug --no-bundle

      # 安装包三件事：统一命名（包管理器清单依赖稳定文件名）、生成校验和、
      # 上传 artifact。GPG 签名与三平台 SHA256SUMS 合并在 M7/T7.3 的 release 工作流做。
      - name: Normalize bundle names and generate SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/ci/rename-bundles.mjs --out bundles --sha256 --arch ${{ runner.arch == 'X64' && 'x64' || 'arm64' }}

      # Linux 冒烟（无显示器也能跑的真实验证，不是摆样子）：
      #   AppImage → 可执行位 + --appimage-extract 能解出自带运行时（不启动 GUI）
      #   deb      → 包结构与内容完整（dpkg-deb 不需要 root，也不真正安装）
      # rpm 按任务定义不在冒烟范围（ubuntu runner 上验证 rpm 需要额外装 rpm 工具链）。
      - name: Smoke test bundles (linux)
        if: startsWith(github.ref, 'refs/tags/') && startsWith(matrix.platform, 'ubuntu')
        run: |
          set -euo pipefail
          APPIMAGE=$(ls bundles/*.AppImage)
          test -x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          test -d squashfs-root/usr/bin
          rm -rf squashfs-root
          DEB=$(ls bundles/*.deb)
          dpkg-deb --info "$DEB" >/dev/null
          dpkg-deb --contents "$DEB" | grep -q 'usr/bin/forgedesk'
          echo "bundle smoke test passed"

      - name: Upload bundles
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forgedesk-bundles-${{ matrix.platform }}
          path: bundles/*
          # tag 构建拿不到安装包就是事故，必须让整个 job 变红
          if-no-files-found: error
          retention-days: 14

      - name: Upload executable
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forgedesk-${{ matrix.platform }}-debug
          # 各平台可执行文件路径不同，缺失的一方由 if-no-files-found 容忍
          path: |
            target/debug/forgedesk
            target/debug/forgedesk.exe
          if-no-files-found: warn
          retention-days: 7
