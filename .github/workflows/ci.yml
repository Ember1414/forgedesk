name: CI

# ===========================================================================
# 两阶段 CI 策略
# 决策记录：docs/adr/ADR-002-private-first-two-phase-ci.md
#
# 【私有阶段（当前）】目标是把免费配额花在最值钱的地方。
#   GitHub Free 的私有仓库额度为 2000 分钟/月，且 macOS runner 按 10x、
#   Windows runner 按 2x 计费（实测一次三平台矩阵约 130 配额分钟）。因此：
#     · pull_request      → 只跑 Linux 质量门禁（1x），约 6-8 分钟
#     · push to main      → 同样只跑质量门禁（**不跑矩阵**）
#     · tag v*.*.*        → 质量门禁 + 三平台构建
#     · workflow_dispatch → 手动；勾选 run_build 才跑矩阵
#     · 不启用夜间任务
#
# 【公开阶段（转公开后）】公共仓库的 Actions 额度不受限制。
#   需要执行的改动（清单见 docs/OPEN-SOURCE-READINESS.md）：
#     1. 删除 build job 上的 `if:`，恢复"每个 PR 都跑三平台矩阵"
#     2. 启用 e2e 与 nightly 工作流
#     3. 把所有 `uses:` 固定到 commit SHA
#
# 【Action 版本约束】GitHub 已于 2026-09-23 移除 Node 20（见
#   https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/ ）。
#   工作流中所有 JavaScript 类 action 必须使用运行在 Node 24 上的版本：
#     actions/checkout@v7、actions/setup-node@v7、actions/upload-artifact@v7、
#     pnpm/action-setup@v6（Swatinem/rust-cache@v2 当前已是最新；
#     dtolnay/rust-toolchain 是复合 action，不涉及 Node 运行时）。
#   升级 action 主版本时请一并核对输入参数是否有破坏性变更。
# ===========================================================================

on:
  pull_request:
  push:
    branches: [main]
    # 打 tag 时必然需要三平台产物（见 build job 的 if 条件）
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      run_build:
        description: '运行三平台构建矩阵？私有仓库下约消耗 130 配额分钟，谨慎勾选'
        type: boolean
        default: false

# 同一分支的旧运行会被取消，避免浪费配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：CI 只需要读仓库内容
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality

      # src-tauri 依赖 WebKitGTK / GTK / libsecret，clippy 覆盖整个 workspace 时需要；
      # libdbus-1-dev 是 crates/credentials 的 keyring（Linux 走 Secret Service）在**编译期**
      # 需要的（libdbus-sys 通过 pkg-config 找它）。运行时还需要一个 Secret Service 提供者
      # （gnome-keyring / KWallet），没有时应用返回 KEYRING_UNAVAILABLE 并走加密文件回退。
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsecret-1-dev \
            libdbus-1-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm lint

      # 硬编码文案不会让任何测试变红，但会在做中英完整覆盖时集中爆雷，
      # 因此从 M0 起就作为门禁（AGENTS.md §6「文案全 i18n」）
      - name: i18n hard-coded copy check
        run: pnpm i18n:lint

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend unit tests
        run: pnpm test

      - name: Design token contrast (WCAG AA)
        run: pnpm check:contrast

      - name: Workflow YAML validation
        run: pnpm check:workflows

      # 本地有、仓库里没有的目录（例如被 .gitignore 误伤的源码目录）会让 cargo
      # 在 CI 上以"failed to load manifest for workspace member"失败，报错位置还指不到根因。
      # 这条检查把它变成推送前就能发现的错误。
      - name: Repository consistency (workspace members tracked)
        run: pnpm check:repo

      # 文档里的相对链接与锚点必须有效：文档是新人唯一的入口，
      # 断链比没有文档更糟——它会让人以为"东西不存在"。
      - name: Documentation links
        run: pnpm check:docs

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

  build:
    name: build (${{ matrix.platform }})
    needs: quality
    # 私有阶段的三平台矩阵只在这两种情况运行：
    #   1. 打 tag（发布需要三平台产物）
    #   2. 手动触发且显式勾选 run_build
    #
    # 为什么不再"每次推 main 都跑"：macOS 10x / Windows 2x 计费，
    # 一次矩阵约 130 配额分钟，而私有仓库每月只有 2000 分钟。
    # 按每天推几次 main 的频率，两周就会耗尽配额；配额耗尽的后果是 CI 整体不可用，
    # 比"少跑几次矩阵"严重得多。
    # 平台差异由本地开发（Windows）+ 发布前的 tag 构建共同覆盖。
    #
    # 转公开后请删除这个 if，恢复"每个 PR 都跑三平台矩阵"（额度不再受限）。
    # 单行写法：块标量会让表达式带上换行，虽然 GitHub 能处理，但这里刻意保持单行以便本地校验
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.run_build)
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
          - macos-14
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.platform }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsecret-1-dev \
            libdbus-1-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------------
      # 构建分两条路径（T0.11）：
      #   tag 构建   → release + 全量打包（安装包、归一化命名、SHA256SUMS、冒烟）
      #   其余构建   → debug + no-bundle（只验证"能出可执行文件"，不下载 WiX/NSIS）
      # ------------------------------------------------------------------
      - name: Build application (release, with bundles)
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm tauri build

      - name: Build application (debug, no bundle)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: pnpm tauri build --debug --no-bundle

      # 安装包三件事：统一命名（包管理器清单依赖稳定文件名）、生成校验和、
      # 上传 artifact。GPG 签名与三平台 SHA256SUMS 合并在 M7/T7.3 的 release 工作流做。
      - name: Normalize bundle names and generate SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/ci/rename-bundles.mjs --out bundles --sha256 --arch ${{ runner.arch == 'X64' && 'x64' || 'arm64' }}

      # Linux 冒烟（无显示器也能跑的真实验证，不是摆样子）：
      #   AppImage → 可执行位 + --appimage-extract 能解出自带运行时（不启动 GUI）
      #   deb      → 包结构与内容完整（dpkg-deb 不需要 root，也不真正安装）
      # rpm 按任务定义不在冒烟范围（ubuntu runner 上验证 rpm 需要额外装 rpm 工具链）。
      - name: Smoke test bundles (linux)
        if: startsWith(github.ref, 'refs/tags/') && startsWith(matrix.platform, 'ubuntu')
        run: |
          set -euo pipefail
          APPIMAGE=$(ls bundles/*.AppImage)
          test -x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          test -d squashfs-root/usr/bin
          rm -rf squashfs-root
          DEB=$(ls bundles/*.deb)
          dpkg-deb --info "$DEB" >/dev/null
          dpkg-deb --contents "$DEB" | grep -q 'usr/bin/forgedesk'
          echo "bundle smoke test passed"

      - name: Upload bundles
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: forgedesk-bundles-${{ matrix.platform }}
          path: bundles/*
          # tag 构建拿不到安装包就是事故，必须让整个 job 变红
          if-no-files-found: error
          retention-days: 14

      - name: Upload executable
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: forgedesk-${{ matrix.platform }}-debug
          # 各平台可执行文件路径不同，缺失的一方由 if-no-files-found 容忍
          path: |
            target/debug/forgedesk
            target/debug/forgedesk.exe
          if-no-files-found: warn
          retention-days: 7
