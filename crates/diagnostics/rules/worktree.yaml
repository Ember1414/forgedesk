    detached: true
  title_key: diag.wt-detached-head.title
  explanation_key: diag.wt-detached-head.explanation
  causes:
    - diag.wt-detached-head.cause1
  fixes:
    - id: create-branch
      label_key: diag.wt-detached-head.fix_create_branch
      action: { kind: 'guide', value: '/branches' }
