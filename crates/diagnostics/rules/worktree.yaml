# 诊断规则（T5.5）——由生成器维护，请勿手工编辑条目顺序。
# 文案只存 key（diag.<id>.*），中英文在 src/lib/i18n/locales/*/shell.json。
# kind=command 的动作由前端直接执行；kind=dangerous 必须走 DangerousActionDialog。

- id: wt-not-a-repo
  stage: [read]
  match:
    all_of:
      - contains: 'not a git repository'
    none_of: []
  confidence: 0.95
  title_key: diag.wt-not-a-repo.title
  explanation_key: diag.wt-not-a-repo.explanation
  causes:
    - diag.wt-not-a-repo.cause1
  fixes:
    - id: open-repo
      label_key: diag.wt-not-a-repo.fix_open_repo
      action: { kind: 'guide', value: '/' }
- id: wt-dubious-ownership
  stage: [read]
  match:
    all_of:
      - contains: 'dubious ownership'
    none_of: []
  confidence: 0.95
  title_key: diag.wt-dubious-ownership.title
  explanation_key: diag.wt-dubious-ownership.explanation
  causes:
    - diag.wt-dubious-ownership.cause1
  fixes:
    - id: mark-safe
      label_key: diag.wt-dubious-ownership.fix_mark_safe
      action: { kind: 'guide', value: '/settings/advanced' }
- id: wt-index-lock
  stage: [write]
  match:
    all_of:
      - regex: 'index\.lock.*exists|Unable to create .*index\.lock'
    none_of: []
  confidence: 0.95
  title_key: diag.wt-index-lock.title
  explanation_key: diag.wt-index-lock.explanation
  causes:
    - diag.wt-index-lock.cause1
  fixes:
    - id: close-other-process
      label_key: diag.wt-index-lock.fix_close_other_process
      action: { kind: 'guide', value: '/settings/advanced' }
- id: wt-local-changes-overwritten
  stage: [write]
  match:
    all_of:
      - regex: 'local changes to the following files would be overwritten|local changes would be overwritten'
    none_of: []
  confidence: 0.92
  title_key: diag.wt-local-changes-overwritten.title
  explanation_key: diag.wt-local-changes-overwritten.explanation
  causes:
    - diag.wt-local-changes-overwritten.cause1
  fixes:
    - id: stash-first
      label_key: diag.wt-local-changes-overwritten.fix_stash_first
      action: { kind: 'command', command: 'git_stash_save' }
    - id: commit-first
      label_key: diag.wt-local-changes-overwritten.fix_commit_first
      action: { kind: 'guide', value: '/commit' }
- id: wt-detached-head
  stage: [read]
