# 诊断规则（T5.5）——由生成器维护，请勿手工编辑条目顺序。
# 文案只存 key（diag.<id>.*），中英文在 src/lib/i18n/locales/*/shell.json。
# kind=command 的动作由前端直接执行；kind=dangerous 必须走 DangerousActionDialog。

- id: net-dns-failure
  stage: [network]
  match:
    all_of:
      - contains: 'Could not resolve host'
    none_of: []
  confidence: 0.9
  title_key: diag.net-dns-failure.title
  explanation_key: diag.net-dns-failure.explanation
  causes:
    - diag.net-dns-failure.cause1
  fixes:
    - id: check-network
      label_key: diag.net-dns-failure.fix_check_network
      action: { kind: 'guide', value: '/settings/advanced' }
