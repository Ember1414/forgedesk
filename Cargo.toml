# ============================================================
# ForgeDesk Rust workspace
#
# 分层约定（详见 AGENTS.md §6 与 docs/ARCHITECTURE.md）：
#   依赖方向永远是「外层 → 内层」：
#     commands (Tauri IPC)  →  services (用例编排)  →  domain (纯逻辑)
#                                                  →  infra crates (git-engine / storage / ...)
#
#   domain 是纯逻辑层，**禁止**依赖任何 IO crate（git2 / rusqlite / reqwest / std::process 等）。
#   这条约束由 crates/domain/tests/no_io_deps.rs 中的自动化断言保护。
# ============================================================

[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/domain",
  "crates/git-engine",
  "crates/storage",
  "crates/provider",
  "crates/snapshot",
  "crates/diagnostics",
  "crates/credentials",
  "crates/jobs",
  "crates/platform",
  "crates/services",
  "crates/commands",
  "crates/plugin-host",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Ember1414/forgedesk"
authors = ["ForgeDesk contributors"]

[workspace.dependencies]
# ---- 内部 crate ----
forgedesk-domain = { path = "crates/domain" }
forgedesk-git-engine = { path = "crates/git-engine" }
forgedesk-storage = { path = "crates/storage" }
forgedesk-provider = { path = "crates/provider" }
forgedesk-snapshot = { path = "crates/snapshot" }
forgedesk-diagnostics = { path = "crates/diagnostics" }
forgedesk-credentials = { path = "crates/credentials" }
forgedesk-jobs = { path = "crates/jobs" }
forgedesk-platform = { path = "crates/platform" }
forgedesk-services = { path = "crates/services" }
forgedesk-commands = { path = "crates/commands" }
forgedesk-plugin-host = { path = "crates/plugin-host" }

# ---- 通用依赖 ----
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# schemars：由 serde 结构体生成 JSON Schema。plugin-host 用它从 plugin.json
# 清单结构生成正式 schema，供文档与第三方校验工具使用（T6.1）。
schemars = "1"
# wasmi：插件 wasm 引擎（T6.1）。选型对比：wasmtime 裁剪+WASI +5.59MB、
# wasmi 仅 +0.74MB（release/lto/opt-level=s 实测）；UI 胶水类插件对解释器
# 性能足够，日后可经 PluginEngine trait 无痛切换引擎。审批结论 2026-10-05。
wasmi = "2"
# sha2：插件 wasm 文件的 SHA256（T6.4 管理页展示供用户核对；0.10 已在
# 依赖树中——octocrab → jsonwebtoken 带入，直接复用零新增 crate）。
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "json"] }
# tracing-appender 提供**非阻塞写入**（WorkerGuard 保证退出前 flush）。
# 注意：它自带的 RollingFileAppender 只支持按时间轮转，不支持"单文件大小上限"，
# 因此轮转策略由 crates/platform 自己实现（见该 crate 的 logging 模块）。
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
secrecy = "0.10"
parking_lot = "0.12"
# notify：跨平台文件监听（T1.10）。它在三平台各自使用原生后端
# （Windows ReadDirectoryChangesW、macOS FSEvents、Linux inotify），
# 我们只做"过滤 + 去抖动"，不自己轮询。
notify = "8"
# winreg：仅 Windows 读写注册表，用于开机自启（T6.9，HKCU Run 键）。
# 平台 crate 保持 forbid(unsafe_code)：unsafe 都在 winreg 内部。
# Windows-only 由 platform crate 的 [target.'cfg(windows)'.dependencies] 门控。
winreg = "0.55"
# unicode-normalization：macOS 文件系统用 NFD 保存路径，比较前必须统一到 NFC（T6.9）。
unicode-normalization = "0.1"

# ---- 本地存储 ----
# bundled：把 SQLite 源码一起编译进产物。为什么不用系统库：
# 三平台（Windows/macOS/Linux 各发行版）自带的 SQLite 版本与编译选项差异很大，
# "在开发机上能跑、在用户机上打开数据库失败"是这类项目最难排查的问题之一；
# 代价是首次编译慢一点（此后走缓存）。
rusqlite = { version = "0.40", features = ["bundled"] }

# ---- Tauri ----
# 版本策略：跟随 2.x 最新补丁（Tauri 2 在 2.x 内保持向后兼容）
tauri = { version = "2", features = [] }
# 自动更新（T7.1）：签名校验 + 下载 + 安装/重启。宿主注册插件，命令在 crates/commands。
# 为什么用 `=` 精确锁定：2.13.x 起要求 rustc 1.90，而本仓库声明的 MSRV 是 1.85；
# caret 会让 CI 与贡献者机器拉到不满足 MSRV 的版本。升级本依赖时应一并评估是否上调
# rust-version（见 docs/DEV-ENV.md）。
tauri-plugin-updater = "=2.12.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# 生产代码中禁止 panic 式写法；测试文件在各自 crate 内通过 #[allow] 局部放开
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# lint 组必须显式指定更低的 priority，否则会与上面的单条 lint 同级冲突
# （clippy::lint_groups_priority）。-1 表示"被上面的单条 lint 覆盖"。
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

[profile.dev]
# 开发期优化依赖项：显著提升 git2 / rusqlite 等重型依赖的运行性能
opt-level = 0
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 2

# wasmi 在 dev profile 以 opt-level>=2 编译时，fuel+宿主函数路径存在原生内存
# 错误（STATUS_ACCESS_VIOLATION；用一次性对照工程实测并锁定：
# O0/O1 均正常，O2/O3 崩，与 debug-assertions / codegen-units 无关；wasmi
# 自家 CI 只覆盖 O0-debug 与 O3-release，恰好漏掉 dev 依赖提速这个组合）。
# 该对照工程是本地一次性的、未入库，故这里只保留结论与最小复现条件（见 docs/acceptance/M6.md）。
# dev 下 wasmi 用 O1：避开 bug 且解释器性能可用；release（O3+LTO）实测正常。
# 升级 wasmi 补丁版本后应重测并移除此覆盖。
[profile.dev.package.wasmi]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
